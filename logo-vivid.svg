<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 395" width="375" height="395" role="img" aria-label="Electronic City United emblem">
  <!--
    A brighter alternative to logo.png, for review — the original is untouched.

    The silhouette is the same shield already traced from logo.png's alpha
    channel and used for the 3D badge, so this mark and the hero geometry stay
    in register. What changes is the treatment: the navy body becomes a warm
    violet-to-teal gradient, the chrome bevel becomes a light aurora rim, and the
    bar chart carries the full accent set rather than four cool hues.
  -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0"   stop-color="#FFE9F1"/>
      <stop offset=".28" stop-color="#3FD6C4"/>
      <stop offset=".55" stop-color="#FFC94D"/>
      <stop offset=".80" stop-color="#FF7DA0"/>
      <stop offset="1"   stop-color="#9E77E0"/>
    </linearGradient>
    <linearGradient id="body" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0"   stop-color="#6039A3"/>
      <stop offset=".52" stop-color="#2C5BA8"/>
      <stop offset="1"   stop-color="#0E9B89"/>
    </linearGradient>
    <radialGradient id="spark" cx=".28" cy=".2" r=".7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCF2ED"/>
    </linearGradient>

    <!-- shield path, shared by rim and body -->
    <path id="shield" d="M188.0 8.5 L160.4 29.2 L124.9 45.9 L86.5 56.8 L56.9 60.7
      L49.0 113.9 L49.0 158.3 L59.8 222.3 L70.7 252.9 L91.4 291.3 L116.0 323.9
      L139.7 347.5 L185.0 383.0 L195.9 384.0 L259.9 322.9 L281.6 293.3
      L300.3 258.8 L321.0 188.9 L324.9 117.0 L318.0 60.7 L284.5 55.8
      L244.1 43.0 L211.6 26.2 Z"/>
  </defs>

  <!-- outer rim -->
  <use href="#shield" fill="url(#rim)"/>
  <!-- body, inset so the rim reads as a bevel -->
  <g transform="translate(187.5 197.5) scale(.918) translate(-187.5 -197.5)">
    <use href="#shield" fill="url(#body)"/>
    <use href="#shield" fill="url(#spark)"/>
  </g>

  <!-- circuit brain, left -->
  <g stroke="#7FE9DC" stroke-width="3.4" fill="none" stroke-linecap="round" opacity=".95">
    <path d="M96 150 q-14-26 8-42 q20-16 40-4"/>
    <path d="M104 186 q-20-10-16-32"/>
    <path d="M120 208 q-24 2-30-18"/>
    <path d="M144 104 q22-8 34 8"/>
    <path d="M132 140 h30 M132 168 h22 M118 122 h26"/>
  </g>
  <g fill="#FFC94D">
    <circle cx="132" cy="140" r="4.6"/><circle cx="162" cy="140" r="4.6"/>
    <circle cx="132" cy="168" r="4.6"/><circle cx="154" cy="168" r="4.6"/>
    <circle cx="118" cy="122" r="4.6"/><circle cx="144" cy="122" r="4.6"/>
    <circle cx="96"  cy="150" r="4.6"/><circle cx="104" cy="186" r="4.6"/>
  </g>

  <!-- skyline, right. Kept inside the shield's taper — the body narrows fast
       below y=250, so towers stop there rather than at the old y=262. -->
  <g fill="#0B3A63" opacity=".5">
    <rect x="204" y="150" width="19" height="100"/>
    <rect x="229" y="126" width="21" height="124"/>
    <rect x="256" y="162" width="17" height="88"/>
    <rect x="279" y="142" width="15" height="108"/>
  </g>
  <!-- rocket -->
  <g transform="translate(258 118) rotate(38)">
    <path d="M0 -30 c9 9 13 21 13 33 L0 40 -13 3 c0-12 4-24 13-33 Z" fill="#FFFFFF"/>
    <circle cy="4" r="6.5" fill="#F2557F"/>
    <path d="M-13 18 l-11 14 12 1 3 11 Z" fill="#3FD6C4"/>
    <path d="M13 18 l11 14 -12 1 -3 11 Z" fill="#3FD6C4"/>
    <path d="M-6 42 q6 20 6 26 q0-6 6-26 Z" fill="#FFC94D"/>
  </g>
  <!-- stars -->
  <g fill="#FFFFFF" opacity=".85">
    <circle cx="300" cy="96" r="2.6"/><circle cx="278" cy="110" r="2"/>
    <circle cx="316" cy="132" r="2.2"/><circle cx="252" cy="92" r="1.9"/>
  </g>

  <!-- ECU wordmark -->
  <text x="187" y="226" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="82" font-weight="800" letter-spacing="2"
        fill="url(#wordmark)">ECU</text>

  <!-- Bar chart: the full accent set. Baseline at y=320 and the span held to
       x 131-246, which is inside the shield where it narrows. -->
  <g>
    <rect x="131" y="276" width="15" height="44" rx="4" fill="#2387E8"/>
    <rect x="151" y="260" width="15" height="60" rx="4" fill="#7C4DCC"/>
    <rect x="171" y="282" width="15" height="38" rx="4" fill="#12B9A6"/>
    <rect x="191" y="250" width="15" height="70" rx="4" fill="#F5B324"/>
    <rect x="211" y="268" width="15" height="52" rx="4" fill="#F2557F"/>
    <rect x="231" y="256" width="15" height="64" rx="4" fill="#1E9E5A"/>
  </g>
</svg>
