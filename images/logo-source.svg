<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 395" width="375" height="395" role="img" aria-label="Electronic City United emblem">
  <!--
    Redraw of the ECU crest, authored from the supplied artwork.

    This is the SOURCE. tools/render-logo.js renders it to a transparent
    logo.png, which is what the site and the 3D badge actually consume — the
    badge needs a raster with a real alpha channel, since it extrudes a
    silhouette traced from that alpha.

    Nothing outside the shield is painted, so the alpha channel is the crest
    outline exactly. Do not add a backing rectangle.
  -->
  <defs>
    <linearGradient id="chrome" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#DCE3EA"/>
      <stop offset=".45" stop-color="#9AA6B2"/>
      <stop offset=".62" stop-color="#EDF2F6"/>
      <stop offset=".82" stop-color="#A8B4C0"/>
      <stop offset="1"   stop-color="#E6ECF2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0"   stop-color="#FFE58A"/>
      <stop offset=".45" stop-color="#F0B429"/>
      <stop offset="1"   stop-color="#A9760C"/>
    </linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A26"/><stop offset="1" stop-color="#060C14"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#12583A"/><stop offset=".55" stop-color="#0B3B27"/><stop offset="1" stop-color="#072418"/>
    </linearGradient>
    <linearGradient id="ecuFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#E3EAF1"/>
      <stop offset=".55" stop-color="#98A5B2"/>
      <stop offset=".75" stop-color="#F2F6FA"/>
      <stop offset="1"   stop-color="#B9C4CF"/>
    </linearGradient>

    <!-- one shield, reused at three scales for rim / gold line / face -->
    <path id="crest" d="M187.5 10 L52 48 C44 50.5 40 57 40 67 L40 196
      C40 286 104 352 187.5 386 C271 352 335 286 335 196 L335 67
      C335 57 331 50.5 323 48 Z"/>
    <clipPath id="faceClip">
      <use href="#crest" transform="translate(187.5 198) scale(.855) translate(-187.5 -198)"/>
    </clipPath>
  </defs>

  <!-- chrome rim -->
  <use href="#crest" fill="url(#chrome)"/>
  <!-- gold band just inside it -->
  <use href="#crest" fill="url(#gold)"
       transform="translate(187.5 198) scale(.925) translate(-187.5 -198)"/>
  <!-- inner face -->
  <g clip-path="url(#faceClip)">
    <rect x="0" y="0" width="187.5" height="395" fill="url(#faceL)"/>
    <rect x="187.5" y="0" width="187.5" height="395" fill="url(#faceR)"/>

    <!-- circuit brain, left -->
    <g stroke="url(#gold)" stroke-width="3.6" fill="none" stroke-linecap="round">
      <path d="M128 92 c-34 -6 -60 14 -62 42 c-18 12 -20 38 -4 52 c-2 26 20 44 44 40"/>
      <path d="M128 92 c24 -4 42 10 44 30 c14 12 12 34 -2 44"/>
      <path d="M106 226 c20 10 44 2 52 -16"/>
      <path d="M128 92 v142"/>
      <path d="M108 116 c-14 4 -20 16 -14 28 c-12 8 -10 24 4 28"/>
      <path d="M148 118 c14 6 18 18 10 28 c10 10 6 26 -8 30"/>
      <path d="M86 152 c10 -6 20 -4 26 4"/>
      <path d="M170 154 c-10 -6 -20 -4 -26 4"/>
      <path d="M94 196 c12 -8 24 -6 32 4"/>
      <path d="M162 198 c-12 -8 -24 -6 -32 4"/>
    </g>
    <g fill="#FFD766">
      <circle cx="94" cy="144" r="3.8"/><circle cx="112" cy="120" r="3.8"/>
      <circle cx="128" cy="92"  r="4.2"/><circle cx="146" cy="122" r="3.8"/>
      <circle cx="170" cy="154" r="3.8"/><circle cx="86"  cy="152" r="3.8"/>
      <circle cx="98"  cy="196" r="3.8"/><circle cx="130" cy="200" r="4"/>
      <circle cx="160" cy="196" r="3.8"/><circle cx="128" cy="234" r="4"/>
    </g>

    <!-- skyline, right -->
    <g fill="#1E8A5A" opacity=".95">
      <rect x="206" y="150" width="20" height="118"/>
      <rect x="232" y="122" width="24" height="146"/>
      <rect x="262" y="164" width="18" height="104"/>
      <rect x="286" y="138" width="20" height="130"/>
      <rect x="312" y="176" width="14" height="92"/>
    </g>
    <g fill="#3FD98F" opacity=".55">
      <rect x="210" y="160" width="4" height="6"/><rect x="218" y="160" width="4" height="6"/>
      <rect x="236" y="134" width="4" height="6"/><rect x="246" y="134" width="4" height="6"/>
      <rect x="236" y="150" width="4" height="6"/><rect x="246" y="150" width="4" height="6"/>
      <rect x="290" y="150" width="4" height="6"/><rect x="298" y="150" width="4" height="6"/>
    </g>
    <!-- circuit traces over the skyline -->
    <g stroke="#3FD98F" stroke-width="2" fill="none" opacity=".5">
      <path d="M200 108 h40 v-18 h34"/>
      <path d="M262 112 h30 v-22"/>
      <path d="M300 120 h26"/>
    </g>
    <!-- stars -->
    <g fill="#BFF3D8">
      <circle cx="252" cy="72" r="2.4"/><circle cx="292" cy="92" r="2"/><circle cx="318" cy="66" r="2.2"/>
      <circle cx="222" cy="86" r="1.8"/><circle cx="272" cy="56" r="1.9"/><circle cx="306" cy="108" r="1.7"/>
    </g>
    <!-- rocket with a gold trail -->
    <path d="M212 150 L286 76" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    <g transform="translate(292 70) rotate(45)">
      <path d="M0 -22 c7 7 10 16 10 24 L0 30 -10 2 c0-8 3-17 10-24 Z" fill="#F4F8FB"/>
      <circle cy="3" r="4.6" fill="#1E8A5A"/>
      <path d="M-9 12 l-7 14 8 -2 Z" fill="#B9C4CF"/>
      <path d="M9 12 l7 14 -8 -2 Z" fill="#B9C4CF"/>
      <path d="M-5 31 q5 14 5 19 q0-5 5-19 Z" fill="#F0B429"/>
    </g>

    <!-- bar chart -->
    <g>
      <rect x="136" y="276" width="19" height="62" rx="3" fill="#1E8A5A"/>
      <rect x="159" y="250" width="19" height="88" rx="3" fill="#EDF1F5"/>
      <rect x="182" y="288" width="19" height="50" rx="3" fill="#F0851F"/>
      <rect x="205" y="238" width="19" height="100" rx="3" fill="#1E8A5A"/>
      <rect x="228" y="268" width="19" height="70" rx="3" fill="#F0851F"/>
    </g>
  </g>

  <!-- ECU wordmark, over the face -->
  <text x="187.5" y="238" text-anchor="middle"
        font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif"
        font-size="92" font-weight="800" letter-spacing="1"
        fill="url(#ecuFill)" stroke="#6E7B88" stroke-width="1.6"
        paint-order="stroke">ECU</text>
</svg>
