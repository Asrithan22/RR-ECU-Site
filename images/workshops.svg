<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Graduation cap, books and a bright idea">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#123B66"/><stop offset=".62" stop-color="#071B33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".04" r=".95">
      <stop offset="0" stop-color="#2387E8" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#2387E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#F0DFB8"/><stop offset="1" stop-color="#D4A64A"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- mortarboard -->
  <g transform="translate(430 250)">
    <path d="M0 -60 L-190 10 L0 80 L190 10 Z" fill="#EBF1F8"/>
    <path d="M0 -60 L-190 10 L0 80 L190 10 Z" fill="#071B33" opacity=".18"/>
    <path d="M-104 42 v70 c0 30 208 30 208 0 v-70 L0 96 Z" fill="#C2D1E3"/>
    <path d="M190 10 v96" stroke="#D4A64A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="190" cy="116" r="17" fill="#D4A64A"/>
  </g>

  <!-- stacked books -->
  <g transform="translate(880 430)">
    <rect x="-140" y="40" width="280" height="44" rx="10" fill="#2387E8"/>
    <rect x="-120" y="-8" width="240" height="44" rx="10" fill="#1E9E5A"/>
    <rect x="-152" y="-56" width="264" height="44" rx="10" fill="#E8722B"/>
    <g stroke="#04101F" stroke-width="5" opacity=".35">
      <path d="M-110 62 h230"/><path d="M-92 14 h190"/><path d="M-124 -34 h214"/>
    </g>
  </g>

  <!-- idea bulb -->
  <g transform="translate(880 210)">
    <circle r="56" fill="url(#bulb)"/>
    <rect x="-20" y="52" width="40" height="30" rx="8" fill="#9C7126"/>
    <g stroke="#D4A64A" stroke-width="8" stroke-linecap="round" opacity=".75">
      <path d="M0 -96 v-30"/><path d="M78 -70 l22 -22"/><path d="M-78 -70 l-22 -22"/>
      <path d="M104 8 h30"/><path d="M-104 8 h-30"/>
    </g>
  </g>

  <path d="M0 750 L0 620 h1200 L1200 750 Z" fill="#04101F" opacity=".5"/>
</svg>
