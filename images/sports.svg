<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Trophy above a chessboard with pieces, beside a football">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#123B66"/><stop offset=".62" stop-color="#071B33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".04" r=".95">
      <stop offset="0" stop-color="#1E9E5A" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#1E9E5A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0DFB8"/><stop offset="1" stop-color="#B88C33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- trophy -->
  <g transform="translate(600 250)">
    <path d="M-92 -140 h184 v66 a92 92 0 0 1 -184 0 Z" fill="url(#gold)"/>
    <path d="M-92 -130 h-50 a50 50 0 0 0 50 50 Z" fill="url(#gold)" opacity=".85"/>
    <path d="M92 -130 h50 a50 50 0 0 1 -50 50 Z" fill="url(#gold)" opacity=".85"/>
    <rect x="-17" y="-14" width="34" height="54" fill="#B88C33"/>
    <rect x="-68" y="40" width="136" height="24" rx="8" fill="url(#gold)"/>
    <rect x="-92" y="64" width="184" height="28" rx="10" fill="#9C7126"/>
  </g>

  <!-- chessboard in perspective, with a pawn and a rook -->
  <g transform="translate(210 470) skewX(-24) scale(1 .52)">
    <g>
      <rect width="336" height="336" fill="#0C2848"/>
      <g fill="#EBF1F8" opacity=".92">
        <rect x="0"  y="0"  width="84" height="84"/><rect x="168" y="0"   width="84" height="84"/>
        <rect x="84" y="84" width="84" height="84"/><rect x="252" y="84"  width="84" height="84"/>
        <rect x="0"  y="168" width="84" height="84"/><rect x="168" y="168" width="84" height="84"/>
        <rect x="84" y="252" width="84" height="84"/><rect x="252" y="252" width="84" height="84"/>
      </g>
    </g>
  </g>

  <!-- pawn -->
  <g transform="translate(262 452)" fill="#EBF1F8">
    <circle cy="-96" r="30"/>
    <path d="M-20 -70 h40 l14 52 h-68 Z"/>
    <rect x="-42" y="-18" width="84" height="20" rx="7"/>
  </g>
  <!-- rook -->
  <g transform="translate(400 468)" fill="#D4A64A">
    <path d="M-40 -110 h16 v20 h16 v-20 h16 v20 h16 v-20 h16 v42 h-96 Z"/>
    <path d="M-30 -68 h60 l10 52 h-80 Z"/>
    <rect x="-46" y="-16" width="92" height="20" rx="7"/>
  </g>

  <!-- football -->
  <g transform="translate(930 480)">
    <circle r="72" fill="#EBF1F8"/>
    <g fill="#071B33">
      <path d="M0 -72 l24 21 -9 31 h-30 l-9-31 Z"/>
      <path d="M-72 -8 l29 -14 22 21 -12 30 -33 -10 Z" opacity=".85"/>
      <path d="M72 -8 l-29 -14 -22 21 12 30 33 -10 Z" opacity=".85"/>
      <path d="M-31 55 l-10 -30 h82 l-10 30 Z" opacity=".7"/>
    </g>
  </g>

  <path d="M0 750 L0 640 h1200 L1200 750 Z" fill="#04101F" opacity=".5"/>
</svg>
